<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshWash Bill Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        
        <!-- Left Panel: Input -->
        <section class="panel input-panel glass">
            <header class="panel-header">
                <div class="logo-area">
                    <i class="fa-solid fa-soap"></i>
                    <h1>FreshWash</h1>
                </div>
                <p>New Laundry Order</p>
            </header>

            <form id="addItemForm">
                <div class="form-group">
                    <label for="itemSelect">Item Type</label>
                    <div class="select-wrapper">
                        <select id="itemSelect" required>
                            <option value="" disabled selected>Select Item...</option>
                            <option value="Shirt" data-price="5">Shirt ($5.00)</option>
                            <option value="Pants" data-price="7">Pants ($7.00)</option>
                            <option value="Suit" data-price="15">Suit ($15.00)</option>
                            <option value="Dress" data-price="12">Dress ($12.00)</option>
                            <option value="Jacket" data-price="10">Jacket ($10.00)</option>
                            <option value="Bed Sheet" data-price="8">Bed Sheet ($8.00)</option>
                            <option value="Other">Other (Custom)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- Custom Item Inputs (Hidden by default) -->
                <div class="form-row hidden" id="customItemRow">
                     <div class="form-group">
                        <label for="customName">Item Name</label>
                        <input type="text" id="customName" placeholder="e.g. Scarf">
                    </div>
                     <div class="form-group">
                        <label for="customPrice">Price ($)</label>
                        <input type="number" id="customPrice" placeholder="0.00" step="0.50">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <div class="quantity-control">
                            <button type="button" class="qty-btn" onclick="adjustQty(-1)"><i class="fa-solid fa-minus"></i></button>
                            <input type="number" id="quantity" value="1" min="1" required>
                            <button type="button" class="qty-btn" onclick="adjustQty(1)"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-plus"></i> Add to Bill
                        </button>
                    </div>
                </div>
            </form>

            <div class="customer-details">
                <h3>Customer Info</h3>
                <div class="form-group">
                    <input type="text" id="customerName" placeholder="Customer Name">
                </div>
                <div class="form-group">
                    <input type="text" id="customerPhone" placeholder="Phone Number">
                </div>
            </div>
        </section>

        <!-- Right Panel: Bill Preview -->
        <section class="panel bill-panel glass">
            <div class="bill-paper" id="printableArea">
                <header class="bill-header">
                    <div class="brand">
                        <i class="fa-solid fa-droplet brand-icon"></i>
                        <div>
                            <h2>FreshWash Laundry</h2>
                            <p class="tagline">Premium Care for Your Clothes</p>
                        </div>
                    </div>
                    <div class="bill-meta">
                        <div class="meta-row">
                            <span class="label">Invoice #</span>
                            <span class="value" id="invoiceNum">#FW-001</span>
                        </div>
                        <div class="meta-row">
                            <span class="label">Date</span>
                            <span class="value" id="billDate">Oct 24, 2023</span>
                        </div>
                    </div>
                </header>

                <div class="customer-section" id="billCustomerDisplay">
                    <p><strong>Bill To:</strong> <span id="displayCustomerName">Guest</span></p>
                    <p><span id="displayCustomerPhone"></span></p>
                </div>

                <div class="bill-table-container">
                    <table class="bill-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th class="text-center">Qty</th>
                                <th class="text-right">Price</th>
                                <th class="text-right">Total</th>
                                <th class="action-col"></th>
                            </tr>
                        </thead>
                        <tbody id="billItems">
                            <!-- Items will be added here -->
                        </tbody>
                    </table>
                </div>

                <div class="bill-footer">
                    <div class="totals">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="total-row">
                            <span>Tax (5%)</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="total-row grand-total">
                            <span>Total</span>
                            <span id="grandTotal">$0.00</span>
                        </div>
                    </div>
                    <div class="signature-area">
                        <p>Thank you for your business!</p>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-secondary" onclick="resetBill()">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                <button class="btn-success" onclick="printBill()">
                    <i class="fa-solid fa-print"></i> Print Bill
                </button>
            </div>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
